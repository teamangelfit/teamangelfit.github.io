<!doctype html>

<style>
:root{--red:#d61018;--bg:#0c0c0c;--card:#1c1c1c;--txt:#fff;--sub:#a8a8a8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
main{width:100%;max-width:420px;text-align:center}

.sub{color:var(--sub);font-size:12px;letter-spacing:3px;margin:6px 0 34px}
a.btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;border-radius:14px;font-size:18px;font-weight:800;text-decoration:none;color:#fff;margin-bottom:14px}
.wa{background:#1fa855}.ig{background:var(--red)}.mail{background:var(--card);font-size:15px!important}
svg{width:24px;height:24px;fill:#fff;flex:none}
.prices{display:flex;gap:8px;margin:30px 0 10px}
.p{flex:1;background:var(--card);border-radius:12px;padding:14px 4px}
.p b{display:block;font-size:22px;font-style:italic;font-weight:900;margin-top:4px}
.p.hl{background:var(--red)}
.p span{font-size:11px;letter-spacing:2px;font-weight:700}
.offer{color:var(--sub);font-size:14px;margin-top:12px}.offer b{color:var(--red)}
