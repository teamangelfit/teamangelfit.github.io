  function pipAbrir(d) {
    PIP.cs = d.comidas || []; PIP.i = Math.max(0, Math.min(d.i || 0, PIP.cs.length - 1));
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    PIP.modo = d.modo || (ios ? 'rec' : 'stream');
    var clave = PIP.modo + '|' + JSON.stringify(PIP.cs);
    if (PIP.v && PIP.clave === clave && PIP.v.readyState >= 2) {
      // ya está listo: se pide en este mismo toque
      if (PIP.modo === 'rec') pipClip(); else pipDibujar();
      var r; try { r = pipPedirYa(); } catch (er) { r = Promise.reject(er); }
      r.then(function () { pipFin(true); }, function (er) { if (er && er.message === 'nopip') { pipFin(false, er); pipAviso('Tu móvil o navegador no permite la ventanita flotante. En iPhone ábrela desde Safari; en Android, desde Chrome.'); } else pipBoton(); });
      return;
    }
    pipPreparar().then(function () {
      // en Chrome el toque sigue valiendo unos segundos; en iPhone no → botón a pantalla completa
      if (ios) { pipBoton(); return; }
      var r; try { r = pipPedirYa(); } catch (er) { r = Promise.reject(er); }
      r.then(function () { pipFin(true); }, function (er) { if (er && er.message === 'nopip') { pipFin(false, er); pipAviso('Tu móvil o navegador no permite la ventanita flotante.'); } else pipBoton(); });
    }, function (er) { pipFin(false, er); pipAviso('Tu móvil o navegador no permite la ventanita flotante.'); });
  }
  function pipFin(ok, er) { try { window.dispatchEvent(new CustomEvent('tafpip', { detail: { ok: ok, modo: PIP.modo, via: PIP.via || '', fl: PIP.fl || 0, i: PIP.i, err: er ? (er.name || '') + ' ' + (er.message || '') : '' } })); } catch (e) { } }
  function pipAviso(t) {
    var ov = document.createElement('div'); ov.id = 'fidOv';
    ov.innerHTML = '<p style="color:#fff;font:600 16px system-ui,sans-serif;text-align:center;max-width:340px;margin:0"></p><button id="fidNo">Entendido</button>';
    ov.firstChild.textContent = t; document.body.appendChild(ov);
    document.getElementById('fidNo').onclick = function () { ov.remove(); };
  }
  // Compartir la foto de un alimento (panel > Biblioteca). Se hace aquí porque el iframe de Google no deja compartir.
  function compartir(d) {
    var base = { title: d.title || 'Alimento', text: d.text || d.title || '' };
    function abrir() { window.open(d.url, '_blank'); }
    function lanzar(data) {
      if (!navigator.share) { abrir(); return; }
      navigator.share(data).catch(function (er) {
        if (er && er.name === 'AbortError') return;
        var ov = document.createElement('div'); ov.id = 'fidOv';
        ov.innerHTML = '<button id="fidSi">Compartir foto</button><button id="fidNo">Cancelar</button>';
        document.body.appendChild(ov);
        document.getElementById('fidNo').onclick = function () { ov.remove(); };
        document.getElementById('fidSi').onclick = function () { ov.remove(); navigator.share(data).catch(function (e2) { if (!e2 || e2.name !== 'AbortError') abrir(); }); };
      });
    }
    fetch(d.url).then(function (r) { return r.blob(); }).then(function (b) {
      var f = new File([b], (base.title.replace(/[^\wáéíóúñü -]/gi, '') || 'alimento') + (/png/.test(b.type) ? '.png' : /webp/.test(b.type) ? '.webp' : '.jpg'), { type: b.type || 'image/jpeg' });
      var data = { files: [f], title: base.title, text: base.text };
      lanzar(navigator.canShare && navigator.canShare(data) ? data : { title: base.title, text: base.text, url: d.url });
    }).catch(function () { lanzar({ title: base.title, text: base.text, url: d.url }); });
  }
  function boton(tipo, responder) {
    var ov = document.createElement('div');
    ov.id = 'fidOv';
    ov.innerHTML = '<button id="fidSi">Confirmar con Face ID o huella</button><button id="fidNo">Cancelar</button>';
    document.body.appendChild(ov);
    document.getElementById('fidNo').onclick = function () { ov.remove(); responder(false, 'Cancelado'); };
    document.getElementById('fidSi').onclick = function () { ov.remove(); verificar(tipo, responder); };
  }
  function verificar(tipo, responder) {
    var p;
    if (tipo === 'create') {
      p = navigator.credentials.create({ publicKey: {
        challenge: azar(32), rp: { name: 'TAF', id: location.hostname },
        user: { id: azar(16), name: 'entrenador', displayName: 'Entrenador TAF' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000
      } }).then(function (c) { localStorage.setItem('taf_fid_id', b64(c.rawId)); });
    } else {
      var id = null; try { id = localStorage.getItem('taf_fid_id'); } catch (er) { }
      if (!id) { responder(false, 'Activa Face ID otra vez desde Ajustes'); return; }
      p = navigator.credentials.get({ publicKey: {
        challenge: azar(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
        allowCredentials: [{ type: 'public-key', id: unb64(id) }]
      } });
    }
    p.then(function () { responder(true); }).catch(function (er) { responder(false, er && er.name === 'NotAllowedError' ? 'Cancelado o no verificado' : (er && er.message) || 'No se ha podido verificar', er); });
  }
  // Instalar: los navegadores dentro de WhatsApp/Instagram/Facebook no dejan instalar → aviso para abrir en Chrome.
  // En Chrome, botón «Instalar app» (beforeinstallprompt). Si se cierra, no vuelve a salir en 7 días.
  (function () {
    var ua = navigator.userAgent, android = /Android/i.test(ua);
    var instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    var no = 0; try { no = +localStorage.getItem('taf_inst_no') || 0; } catch (e) { }
    if (instalada || no > Date.now() - 7 * 864e5) return;
    function barra(html) {
      var b = document.createElement('div'); b.id = 'instBar'; b.innerHTML = html + '<button id="instX" aria-label="Cerrar">✕</button>';
      document.body.appendChild(b);
      document.getElementById('instX').onclick = function () { b.remove(); try { localStorage.setItem('taf_inst_no', Date.now()); } catch (e) { } };
      return b;
    }
    if (/; wv\)|Instagram|FBAN|FBAV|WhatsApp|Line\/|MicroMessenger/i.test(ua)) {
      if (android) barra('<span>Para instalar la app, ábrela en Chrome</span><a id="instSi" href="intent:/\/' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end">Abrir en Chrome</a>');
      else barra('<span>Para instalarla, toca ··· y elige «Abrir en Safari»</span>');
      return;
    }
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      var b = barra('<span>Instala TAF en tu móvil</span><button id="instSi">Instalar app</button>');
      document.getElementById('instSi').onclick = function () { b.remove(); e.prompt(); };
    });
  })();
  // Página de prueba de la dieta flotante (no abre la app): teamangelfit.github.io/?pipdemo=1
  if (/[?&]pipdemo=1/.test(location.search)) {
    document.getElementById('wrap').remove(); document.getElementById('splash').remove();
    document.body.style.background = '#151515';
    var pd = document.createElement('div');
    pd.style.cssText = 'position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px 20px;color:#fff;font:16px/1.4 system-ui,-apple-system,sans-serif';
    pd.innerHTML = '<h2 style="margin:0 0 8px">Prueba dieta flotante</h2><p style="color:#bbb;margin:0 0 16px">Toca una prueba. Si sale la ventanita, sal a WhatsApp y mira si se queda encima y si las flechas cambian de comida.</p>' +
      '<button data-m="stream" style="display:block;width:100%;padding:16px;margin:0 0 10px;border:0;border-radius:12px;background:#e01e1e;color:#fff;font:700 17px system-ui">Prueba 1</button>' +
      '<button data-m="rec" style="display:block;width:100%;padding:16px;margin:0 0 10px;border:0;border-radius:12px;background:#444;color:#fff;font:700 17px system-ui">Prueba 2</button>' +
      '<button data-m="auto" style="display:block;width:100%;padding:16px;margin:0 0 16px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font:700 17px system-ui">Prueba 3 (sola al salir)</button><p id="pdRes" style="font-weight:700"></p>';
    document.body.appendChild(pd);
    var ejemplo = [
      { t: 'Desayuno', s: 'Tortitas con queso batido · 420 kcal · P 32 g', rows: [['Tortitas de arroz', '40 g'], ['Queso batido 0%', '150 g'], ['Miel', '10 g']] },
      { t: 'Comida', s: 'Pasta con pollo · 808 kcal · P 54 g', rows: [['Pasta blanca (en crudo)', '153 g'], ['Pechuga de pollo', '117 g'], ['Aceite de oliva', '10 g'], ['Verdura', 'al gusto']] },
      { t: 'Cena', s: 'Arroz con atún · 650 kcal · P 45 g', rows: [['Arroz (en crudo)', '80 g'], ['Atún al natural', '2 latas'], ['Aguacate', '60 g']] }];
    window.addEventListener('tafpip', function (e) { document.getElementById('pdRes').textContent = (e.detail.ok ? '✅ Ventanita abierta' : '❌ No se abre') + ' (prueba ' + (e.detail.modo === 'rec' ? 2 : 1) + ')' + (e.detail.fl ? ' · flechas: ' + e.detail.fl + ' · comida ' + (e.detail.i + 1) : '') + (e.detail.via ? ' · ' + e.detail.via : '') + (e.detail.err ? ' · ' + e.detail.err : ''); });
    [].forEach.call(pd.querySelectorAll('button'), function (b) { b.onclick = function () { var m = b.getAttribute('data-m'); if (m === 'auto') { document.getElementById('pdRes').textContent = 'Preparando…'; pipAuto({ comidas: ejemplo, i: 1, ver: true }).then(function () { document.getElementById('pdRes').textContent = 'Listo: ahora desliza hacia arriba para salir (sin tocar nada más)'; }); return; } document.getElementById('pdRes').textContent = 'Abriendo…'; pipAbrir({ comidas: ejemplo, i: 1, modo: m }); }; });
  } else {
  // Google reserva el parámetro "c": los enlaces antiguos ?c= se pasan como ?cliente=
  if (q.get('c') && !q.get('cliente')) { q.set('cliente', q.get('c')); q.delete('c'); }
  q.set('host', location.origin + location.pathname); // para que el panel cree los enlaces con esta web
  var app = q.get('app');
  document.title = q.get('coach') ? 'TAF · Panel' : app === 'dieta' ? 'TAF Nutrición' : app === 'entreno' ? 'TAF Entreno' : 'TeamAngelFit';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  if (EXEC.indexOf('https://script.google.com/') !== 0) {
    sp.innerHTML = '<b>TAF</b><i></i><span style="letter-spacing:0;font-weight:600;padding:0 24px;text-align:center">Falta poner la URL /exec en index.html</span>';
  } else {
    f.onload = function () { sp.className = 'off'; };
    setTimeout(function () { sp.className = 'off'; }, 8000);
    f.src = EXEC + '?' + q.toString();
  }
  }
</script>
