<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TeamAngelFit">
<title>TeamAngelFit</title>
<!-- v22 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #151515; overflow: hidden; }
  #wrap {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height: 100vh; height: 100dvh;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; margin: 0; background: #f2f2f2; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #151515; color: #fff; font: 800 14px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 6px; transition: opacity .3s;
  }
  #splash b { font-size: 56px; letter-spacing: 0; font-style: italic; }
  #splash i { display: block; width: 70px; height: 4px; background: #e01e1e; margin: 6px 0 14px; }
  #splash.off { opacity: 0; pointer-events: none; }
  #fidOv { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: rgba(0,0,0,.75); }
  #instBar { position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 8px); z-index: 8; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #151515; color: #fff; font: 600 14px system-ui, -apple-system, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
  #instBar span { flex: 1; }
  #instBar #instSi { padding: 8px 12px; border: 0; border-radius: 8px; background: #e01e1e; color: #fff; font: 700 14px system-ui, sans-serif; text-decoration: none; white-space: nowrap; }
  #instBar #instX { border: 0; background: none; color: #aaa; font-size: 18px; padding: 4px; }
  #fidOv button { width: 100%; max-width: 340px; padding: 16px; border: 0; border-radius: 12px; font: 700 16px system-ui, -apple-system, sans-serif; background: #e0e0e0; color: #151515; }
  #fidOv #fidSi { background: #e01e1e; color: #fff; }
</style>
</head>
<body>
<div id="wrap"><iframe id="app" title="TeamAngelFit" allow="clipboard-write; fullscreen"></iframe></div>
<div id="splash"><b>TAF</b><i></i>TEAM ANGEL FIT</div>
<script>
  // URL de la app en Google (Implementar > Gestionar implementaciones > URL de la aplicación web, la que acaba en /exec)
  var EXEC = 'https://script.google.com/macros/s/AKfycbwEjy4qlz0JPDYLtE1HdNZItA9YhVeiOAflHp-yIFVRfAL5pV4Rs78R0h8wEH1r3CBRAQ/exec';

  var q = new URLSearchParams(location.search);
  // Instalada como app se abre con ?pwa=1: se recupera el último enlace abierto (cliente o panel)
  try {
    if (q.get('cliente') || q.get('c') || q.get('coach')) localStorage.setItem('taf_q', location.search);
    else { var sv = localStorage.getItem('taf_q'); if (sv) q = new URLSearchParams(sv); }
  } catch (e) { }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });

  // Face ID / huella (WebAuthn): se hace aquí porque el iframe de Google no puede pedirlo. La app lo pide con postMessage.
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function azar(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  window.addEventListener('message', function (e) {
    if (!e.data || (e.data.taf !== 'fid' && e.data.taf !== 'ses') || !/\.googleusercontent\.com$/.test(new URL(e.origin === 'null' ? 'https://x' : e.origin).hostname)) return;
    // Sesión de 7 días y Face ID se guardan aquí: en iPhone se borra lo que guarda el iframe de Google
    if (e.data.taf === 'ses') {
      try {
        if (e.data.op === 't') { window.tafCarga = Math.round(performance.now()); return; } // ms hasta ver el panel
        if (e.data.op === 'set') {
          if ('s' in e.data) { if (e.data.s) localStorage.setItem('taf_sess', JSON.stringify(e.data.s)); else localStorage.removeItem('taf_sess'); }
          if ('fid' in e.data) { if (e.data.fid) localStorage.setItem('taf_fid', '1'); else localStorage.removeItem('taf_fid'); }
          return;
        }
        var s = JSON.parse(localStorage.getItem('taf_sess') || 'null');
        e.source.postMessage({ taf: 'ses', s: s, fid: localStorage.getItem('taf_fid') === '1' && !!localStorage.getItem('taf_fid_id') }, e.origin);
      } catch (er) { e.source.postMessage({ taf: 'ses', s: null, fid: false }, e.origin); }
      return;
    }
    function responder(ok, msg) { e.source.postMessage({ taf: 'fid', ok: ok, msg: msg || '' }, e.origin); }
    if (!window.PublicKeyCredential) { responder(false, 'Este móvil o navegador no permite Face ID aquí'); return; }
    // Primero se intenta sin tocar nada. Safari lo rechaza al instante si no hay un toque en esta página:
    // entonces sale un botón a pantalla completa (el toque dentro del iframe no le vale)
    var tipo = e.data.tipo, t0 = Date.now();
    verificar(tipo, function (ok, msg, er) {
      if (!ok && er && er.name === 'NotAllowedError' && Date.now() - t0 < 1500) boton(tipo, responder); else responder(ok, msg);
    });
  });
  function boton(tipo, responder) {
    var ov = document.createElement('div');
    ov.id = 'fidOv';
    ov.innerHTML = '<button id="fidSi">Confirmar con Face ID o huella</button><button id="fidNo">Cancelar</button>';
    document.body.appendChild(ov);
    document.getElementById('fidNo').onclick = function () { ov.remove(); responder(false, 'Cancelado'); };
    document.getElementById('fidSi').onclick = function () { ov.remove(); verificar(tipo, responder); };
  }
  function verificar(tipo, responder) {
    var p;
    if (tipo === 'create') {
      p = navigator.credentials.create({ publicKey: {
        challenge: azar(32), rp: { name: 'TAF', id: location.hostname },
        user: { id: azar(16), name: 'entrenador', displayName: 'Entrenador TAF' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000
      } }).then(function (c) { localStorage.setItem('taf_fid_id', b64(c.rawId)); });
    } else {
      var id = null; try { id = localStorage.getItem('taf_fid_id'); } catch (er) { }
      if (!id) { responder(false, 'Activa Face ID otra vez desde Ajustes'); return; }
      p = navigator.credentials.get({ publicKey: {
        challenge: azar(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
        allowCredentials: [{ type: 'public-key', id: unb64(id) }]
      } });
    }
    p.then(function () { responder(true); }).catch(function (er) { responder(false, er && er.name === 'NotAllowedError' ? 'Cancelado o no verificado' : (er && er.message) || 'No se ha podido verificar', er); });
  }
  // Instalar: los navegadores dentro de WhatsApp/Instagram/Facebook no dejan instalar → aviso para abrir en Chrome.
  // En Chrome, botón «Instalar app» (beforeinstallprompt). Si se cierra, no vuelve a salir en 7 días.
  (function () {
    var ua = navigator.userAgent, android = /Android/i.test(ua);
    var instalada = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
    var no = 0; try { no = +localStorage.getItem('taf_inst_no') || 0; } catch (e) { }
    if (instalada || no > Date.now() - 7 * 864e5) return;
    function barra(html) {
      var b = document.createElement('div'); b.id = 'instBar'; b.innerHTML = html + '<button id="instX" aria-label="Cerrar">✕</button>';
      document.body.appendChild(b);
      document.getElementById('instX').onclick = function () { b.remove(); try { localStorage.setItem('taf_inst_no', Date.now()); } catch (e) { } };
      return b;
    }
    if (/; wv\)|Instagram|FBAN|FBAV|WhatsApp|Line\/|MicroMessenger/i.test(ua)) {
      if (android) barra('<span>Para instalar la app, ábrela en Chrome</span><a id="instSi" href="intent:/\/' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end">Abrir en Chrome</a>');
      else barra('<span>Para instalarla, toca ··· y elige «Abrir en Safari»</span>');
      return;
    }
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      var b = barra('<span>Instala TAF en tu móvil</span><button id="instSi">Instalar app</button>');
      document.getElementById('instSi').onclick = function () { b.remove(); e.prompt(); };
    });
  })();
  // Google reserva el parámetro "c": los enlaces antiguos ?c= se pasan como ?cliente=
  if (q.get('c') && !q.get('cliente')) { q.set('cliente', q.get('c')); q.delete('c'); }
  q.set('host', location.origin + location.pathname); // para que el panel cree los enlaces con esta web
  var app = q.get('app');
  document.title = q.get('coach') ? 'TAF · Panel' : app === 'dieta' ? 'TAF Nutrición' : app === 'entreno' ? 'TAF Entreno' : 'TeamAngelFit';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  if (EXEC.indexOf('https://script.google.com/') !== 0) {
    sp.innerHTML = '<b>TAF</b><i></i><span style="letter-spacing:0;font-weight:600;padding:0 24px;text-align:center">Falta poner la URL /exec en index.html</span>';
  } else {
    f.onload = function () { sp.className = 'off'; };
    setTimeout(function () { sp.className = 'off'; }, 8000);
    f.src = EXEC + '?' + q.toString();
  }
</script>
</body>
</html>
