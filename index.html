<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TeamAngelFit">
<title>TeamAngelFit</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #151515; overflow: hidden; }
  #wrap {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    height: 100vh; height: 100dvh;
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; margin: 0; background: #f2f2f2; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #151515; color: #fff; font: 800 14px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 6px; transition: opacity .3s;
  }
  #splash b { font-size: 56px; letter-spacing: 0; font-style: italic; }
  #splash i { display: block; width: 70px; height: 4px; background: #e01e1e; margin: 6px 0 14px; }
  #splash.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><iframe id="app" title="TeamAngelFit" allow="clipboard-write; fullscreen"></iframe></div>
<div id="splash"><b>TAF</b><i></i>TEAM ANGEL FIT</div>
<script>
  // URL de la app en Google (Implementar > Gestionar implementaciones > URL de la aplicación web, la que acaba en /exec)
  var EXEC = 'https://script.google.com/macros/s/AKfycbwEjy4qlz0JPDYLtE1HdNZItA9YhVeiOAflHp-yIFVRfAL5pV4Rs78R0h8wEH1r3CBRAQ/exec';

  var q = new URLSearchParams(location.search);
  // Google reserva el parámetro "c": los enlaces antiguos ?c= se pasan como ?cliente=
  if (q.get('c') && !q.get('cliente')) { q.set('cliente', q.get('c')); q.delete('c'); }
  q.set('host', location.origin + location.pathname); // para que el panel cree los enlaces con esta web
  var app = q.get('app');
  document.title = q.get('coach') ? 'TAF · Panel' : app === 'dieta' ? 'TAF Nutrición' : app === 'entreno' ? 'TAF Entreno' : 'TeamAngelFit';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  if (EXEC.indexOf('https://script.google.com/') !== 0) {
    sp.innerHTML = '<b>TAF</b><i></i><span style="letter-spacing:0;font-weight:600;padding:0 24px;text-align:center">Falta poner la URL /exec en index.html</span>';
  } else {
    f.onload = function () { sp.className = 'off'; };
    setTimeout(function () { sp.className = 'off'; }, 8000);
    f.src = EXEC + '?' + q.toString();
  }
</script>
</body>
</html>
